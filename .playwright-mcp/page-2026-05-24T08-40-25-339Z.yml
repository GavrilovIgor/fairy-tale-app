            - heading "Как лисёнок Миша подружился с темнотой" [level=2] [ref=e221]
          - img "Иллюстрация 1" [ref=e225]
          - paragraph [ref=e227]: Лисёнок Миша жил в уютной норке под корнями старой сосны. Каждое утро он просыпался от солнечных лучей, пахнущих сосновой смолой и свежей землей. Миша обожал бегать по лесу, гоняться за стрекозами, слушать, как шелестят листья под его лапками. Его хвостик-метелочка всегда был поднят высоко и весело помахивал, когда он играл. Но вот наступал вечер. Солнышко уходило спать за дальние холмы, и в лесу становилось… по-другому. Сначала Мише нравились длинные тени, которые вытягивались, как сонные коты. Он играл с ними, прятался за ними. Но потом тени становились такими густыми, что сливались в одно большое, черное покрывало. Оно накрывало деревья, кусты, даже любимый пенек Миши. Известные тропинки исчезали, знакомые запахи смешивались с чем-то новым, непонятным. Казалось, что за каждым темным кустом притаилось что-то, чего раньше не было. Это «что-то» было огромным и молчаливым. В такие вечера у Миши в животе что-то сжималось в маленький, холодный комочек. Его ушки опускались, а кончик хвостика, вместо того чтобы весело махать, поджимался к животу. По телу пробегала легкая дрожь, как от холодного ветерка. Это было не просто скучно, это было… немного страшно. Однажды, когда ночь уже плотно обняла лес, а Миша сидел в норке, вздыхая, мимо пролетел старый Филин-Мудрец. У него были большие желтые глаза и перья, пахнущие осенними листьями и старыми книгами. "Что это у тебя, лисенок? – проскрипел Филин низким голосом, – Отчего нос повесил?" Миша шмыгнул носом. "Там… там темно, Филин. Очень темно. И страшно". Филин прищурил глаза. "А что именно страшно? Сама темнота? Или то, что в ней прячется?" Миша задумался. "Я не знаю. Мне просто кажется, что там… пусто и непонятно". "Хм, – прогудел Филин. – А ты пробовал… её рассмотреть? Темноту-то?" И, широко распахнув крылья, бесшумно улетел в самую гущу теней.
        - generic [ref=e228]:
          - paragraph [ref=e230]: ГЛАВА 2
          - img "Иллюстрация 2" [ref=e234]
          - paragraph [ref=e236]: "Миша сидел еще немного, думал о словах Филина. \"Рассмотреть темноту? Как это?\" Он осторожно выглянул из норки. Темнота встретила его прохладным, влажным запахом ночных цветов. Небо было черным-черным, но в нем вдруг появились маленькие, мерцающие точки – звезды. \"Пойду, – прошептал Миша, – посмотрю… хоть чуть-чуть\". Он сделал один маленький шажок, потом еще один, прижимаясь к знакомым кустам. Его лапки чувствовали мягкий мох и прохладную росу на траве. Он прислушался: лес не молчал! Тихонько шелестели листья, где-то вдалеке пищала летучая мышь, а совсем рядом потрескивали сухие веточки под лапами какого-то ночного зверька. Это были звуки, которых днем не услышишь. Миша поднял голову. Вдруг прямо над ним, между ветками, показался крошечный огонек, потом еще один. Это были светлячки, они мигали, словно крошечные маячки. И вдруг у него в груди стало чуть-чуть теплее, а тот холодный комочек в животе немножко размяк. Темнота не была пустой! Она была наполнена тихими звуками, мерцающими огоньками, свежими запахами. Она просто другая. Миша сделал еще один шаг. И еще. И заметил, что его лапки уже не дрожат так сильно. Он даже слегка вильнул хвостом. Страх не исчез совсем, но он стал чуточку меньше, как будто спрятался за маленький кустик, уже не такой большой и страшный, каким казался. Миша дошел до небольшой полянки, где обычно играл днем. Теперь там лежал лунный свет, и трава казалась серебряной. Он постоял, вдыхая свежий ночной воздух, и почувствовал себя смелее. Потом, с новым ощущением покоя, вернулся в норку. Там было тепло и уютно. Теперь он знал, что темнота – это не пустота, а просто другая сторона дня, полная своих чудес. И маленький Миша, обняв себя хвостиком, уснул под шепот ночного леса, уже не боясь того, что прячется за черным покрывалом."

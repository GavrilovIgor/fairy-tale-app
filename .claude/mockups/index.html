<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paywall — вариант А</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a2e22; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding: 32px 24px 64px; }

  h1 { color: #a8c4a0; text-align: center; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 40px; font-weight: 500; }

  .row { display: flex; gap: 40px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }

  .device-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .device-label { color: #6b8f73; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  /* Phone frame */
  .phone-frame {
    width: 375px;
    background: #111;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 0 0 2px #333, 0 24px 60px rgba(0,0,0,0.7);
  }
  .phone-screen {
    border-radius: 32px;
    overflow: hidden;
    background: rgba(10,31,20,0.85);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 580px;
    position: relative;
  }

  /* Desktop frame */
  .desktop-frame {
    width: 720px;
    background: #222;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #333, 0 24px 60px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .desktop-bar {
    height: 32px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .desktop-screen {
    background: rgba(10,31,20,0.85);
    backdrop-filter: blur(8px);
    min-height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  /* Card */
  .card {
    background: #fffdf8;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
    width: 100%;
  }
  .phone-screen .card { border-radius: 24px 24px 0 0; }

  .card-header {
    height: 120px;
    background: #0d2b1e;
    position: relative;
    overflow: hidden;
  }
  .card-header-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0d2b1e 0%, #1a3d28 50%, #0d2b1e 100%);
    opacity: 0.9;
  }
  .card-header-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, #fffdf8);
  }
  .card-header-title {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: 17px;
    color: #0d2b1e;
  }
  .close-btn {
    position: absolute; top: 12px; right: 12px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px; cursor: pointer;
  }

  .card-body { padding: 20px 24px 24px; }

  /* Progress */
  .progress-wrap { margin-bottom: 18px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 12px; color: #9ca3af; }
  .progress-count { font-size: 12px; font-weight: 600; color: #0d2b1e; }
  .progress-bar { height: 5px; background: rgba(13,43,30,0.1); border-radius: 4px; }
  .progress-fill { height: 5px; background: #c4812a; border-radius: 4px; width: 100%; }

  .card-title {
    font-family: Georgia, serif;
    font-style: italic;
    font-weight: bold;
    font-size: 22px;
    text-align: center;
    color: #0d2b1e;
    margin-bottom: 20px;
    line-height: 1.3;
  }

  /* Buttons */
  .btn {
    width: 100%;
    border-radius: 16px;
    padding: 17px 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: none;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .btn-name { font-size: 16px; }
  .btn-price { font-size: 22px; font-weight: 900; }

  /* Pack — amber, secondary feel */
  .btn-pack {
    background: rgba(196,129,42,0.1);
    border: 1.5px solid rgba(196,129,42,0.35);
    color: #7a4e0a;
  }
  .btn-pack .btn-price { color: #a46713; }

  /* Unlimited — green, preferred */
  .btn-unlimited {
    background: #0d2b1e;
    color: white;
    box-shadow: 0 4px 20px rgba(13,43,30,0.35);
    position: relative;
  }
  .recommended-badge {
    position: absolute;
    top: -10px; right: 16px;
    background: #3a9e5f;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .pay-methods { text-align: center; font-size: 12px; color: #b0b8b0; margin: 6px 0 10px; }
  .code-link {
    width: 100%; text-align: center; font-size: 12px; color: #b0b8b0;
    background: none; border: none; cursor: pointer; padding: 6px;
    font-family: inherit;
  }

  /* Desktop card max-width */
  .desktop-screen .card { max-width: 380px; border-radius: 24px; }
</style>
</head>
<body>

<h1>Экран оплаты — вариант А</h1>

<div class="row">

  <!-- MOBILE -->
  <div class="device-wrap">
    <div class="device-label">Телефон</div>
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="card">
          <div class="card-header">
            <div class="card-header-bg"></div>
            <div class="card-header-gradient"></div>
            <div class="close-btn">×</div>
            <div class="card-header-title">Волшебная сказка</div>
          </div>
          <div class="card-body">
            <div class="progress-wrap">
              <div class="progress-meta">
                <span class="progress-label">Бесплатные сказки</span>
                <span class="progress-count">6 / 6</span>
              </div>
              <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>

            <div class="card-title">Продолжить<br>волшебство</div>

            <button class="btn btn-pack">
              <span class="btn-name">3 сказки</span>
              <span class="btn-price">49 ₽</span>
            </button>

            <button class="btn btn-unlimited" style="position:relative">
              <span class="recommended-badge">Лучший выбор</span>
              <span class="btn-name">Безлимит на месяц</span>
              <span class="btn-price">199 ₽</span>
            </button>

            <div class="pay-methods">СБП · Карта · SberPay · Mir Pay</div>
            <button class="code-link">Есть код активации →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- DESKTOP -->
  <div class="device-wrap">
    <div class="device-label">Компьютер</div>
    <div class="desktop-frame">
      <div class="desktop-bar">
        <div class="dot" style="background:#ff5f57"></div>
        <div class="dot" style="background:#febc2e"></div>
        <div class="dot" style="background:#28c840"></div>
      </div>
      <div class="desktop-screen">
        <div class="card">
          <div class="card-header">
            <div class="card-header-bg"></div>
            <div class="card-header-gradient"></div>
            <div class="close-btn">×</div>
            <div class="card-header-title">Волшебная сказка</div>
          </div>
          <div class="card-body">
            <div class="progress-wrap">
              <div class="progress-meta">
                <span class="progress-label">Бесплатные сказки</span>
                <span class="progress-count">6 / 6</span>
              </div>
              <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>

            <div class="card-title">Продолжить<br>волшебство</div>

            <button class="btn btn-pack">
              <span class="btn-name">3 сказки</span>
              <span class="btn-price">49 ₽</span>
            </button>

            <button class="btn btn-unlimited" style="position:relative">
              <span class="recommended-badge">Лучший выбор</span>
              <span class="btn-name">Безлимит на месяц</span>
              <span class="btn-price">199 ₽</span>
            </button>

            <div class="pay-methods">СБП · Карта · SberPay · Mir Pay</div>
            <button class="code-link">Есть код активации →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
